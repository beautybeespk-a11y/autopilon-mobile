name: autopilon_mobile
description: Autopilon mobile client — Flutter app consuming the existing Autopilon backend APIs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation, with auth-aware redirects
  go_router: ^14.2.0

  # HTTP client + session-cookie persistence. The backend uses cookie-based
  # sessions (express-session), same as the web client — rather than adding
  # a parallel token-auth system to the backend (which would duplicate the
  # existing auth logic), the mobile app carries a real cookie jar, exactly
  # like a browser does. This is the whole reason cookie_jar/dio_cookie_manager
  # are here instead of just plain http.
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Secure, persistent storage for the cookie jar and light session state
  # (remember-me flag, last-used base URL) — Keychain on iOS, Keystore-backed
  # EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^9.2.2

  # File-based persistence location for the cookie jar (app documents dir).
  path_provider: ^2.1.3

  # Chat composer's attach-a-photo flow (gallery + camera). Requires
  # NSPhotoLibraryUsageDescription/NSCameraUsageDescription in the iOS
  # project's Info.plist and the camera permission in the Android manifest —
  # this repo doesn't carry the ios/ and android/ platform folders (they live
  # in the Replit project per REPLIT_SETUP.md), so add those entries there.
  image_picker: ^1.1.2

  # Opens Stripe checkout/portal URLs (marketplace purchases, billing plan
  # changes) in the device browser — payment itself stays off-app, same as
  # the web client's window.location redirect to Stripe.
  url_launcher: ^6.3.0

  # Phase 12D — biometric app lock (Settings > Security toggle). Android
  # needs the USE_BIOMETRIC permission in the manifest AND MainActivity to
  # extend FlutterFragmentActivity instead of the default FlutterActivity —
  # add both wherever the android/ platform folder actually lives (see the
  # image_picker note above for why it isn't in this repo).
  local_auth: ^2.3.0

  # Phase 12D — offline mode: detects connectivity for the app-wide offline
  # banner (see AppShell) and to decide when to fall back to cached data.
  connectivity_plus: ^6.0.5

  # Phase 12D — offline mode: simple local cache for "last loaded" screen
  # data (starting with the dashboard) so there's something to show when
  # connectivity_plus reports no connection.
  shared_preferences: ^2.3.2

  # Exact font match with the web client (Space Grotesk / Inter / JetBrains
  # Mono) without bundling font files by hand — same families, fetched once
  # and cached.
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
