name: autopilon_mobile
description: Autopilon mobile client — Flutter app consuming the existing Autopilon backend APIs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation, with auth-aware redirects
  go_router: ^14.2.0

  # HTTP client + session-cookie persistence. The backend uses cookie-based
  # sessions (express-session), same as the web client — rather than adding
  # a parallel token-auth system to the backend (which would duplicate the
  # existing auth logic), the mobile app carries a real cookie jar, exactly
  # like a browser does. This is the whole reason cookie_jar/dio_cookie_manager
  # are here instead of just plain http.
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Secure, persistent storage for the cookie jar and light session state
  # (remember-me flag, last-used base URL) — Keychain on iOS, Keystore-backed
  # EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^9.2.2

  # File-based persistence location for the cookie jar (app documents dir).
  path_provider: ^2.1.3

  # Chat composer's attach-a-photo flow (gallery + camera). Requires
  # NSPhotoLibraryUsageDescription/NSCameraUsageDescription in the iOS
  # project's Info.plist and the camera permission in the Android manifest —
  # this repo doesn't carry the ios/ and android/ platform folders (they live
  # in the Replit project per REPLIT_SETUP.md), so add those entries there.
  image_picker: ^1.1.2

  # Opens Stripe checkout/portal URLs (marketplace purchases, billing plan
  # changes) in the device browser — payment itself stays off-app, same as
  # the web client's window.location redirect to Stripe.
  url_launcher: ^6.3.0

  # Phase 12D — biometric app lock (Settings > Security toggle). Android
  # needs the USE_BIOMETRIC permission in the manifest AND MainActivity to
  # extend FlutterFragmentActivity instead of the default FlutterActivity —
  # add both wherever the android/ platform folder actually lives (see the
  # image_picker note above for why it isn't in this repo).
  local_auth: ^2.3.0

  # Phase 12D — offline mode: detects connectivity for the app-wide offline
  # banner (see AppShell) and to decide when to fall back to cached data.
  connectivity_plus: ^6.0.5

  # Phase 12D — offline mode: simple local cache for "last loaded" screen
  # data (starting with the dashboard) so there's something to show when
  # connectivity_plus reports no connection.
  shared_preferences: ^2.3.2

  # Phase 12D — push notifications. Requires lib/firebase_options.dart and
  # android/app/google-services.json, both generated by running
  # `flutterfire configure` against a real Firebase project (see the setup
  # notes wherever this session's chat history documents the exact steps —
  # both files are committed to this repo already for the configured project).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Exact font match with the web client (Space Grotesk / Inter / JetBrains
  # Mono) without bundling font files by hand — same families, fetched once
  # and cached.
  google_fonts: ^6.2.1

  # Phase 13 — voice messages. `record` captures the mic to a local file for
  # upload to POST /voice/transcribe; `audioplayers` plays back the TTS
  # bytes returned by POST /voice/speak via BytesSource (no local file
  # management needed for playback). Android needs RECORD_AUDIO in the
  # manifest; iOS needs NSMicrophoneUsageDescription in Info.plist — add
  # both wherever the android/ and ios/ platform folders actually live (see
  # the image_picker note above for why they aren't in this repo).
  # Pinned to 7.x specifically — 5.1.2 pulled in a record_linux release
  # whose version had drifted out of sync with record_platform_interface
  # (a packaging issue in that old release, not our code), breaking
  # compilation. record's public API used here (AudioRecorder, RecordConfig,
  # start/stop/cancel/hasPermission) has been stable since 5.0.0, so this
  # jump doesn't need any code changes.
  record: ^7.1.1
  audioplayers: ^6.1.0

  # Phase 14 — File Manager. `file_picker` covers the "Document Picker"
  # requirement (any file type, not just photos — image_picker above stays
  # for camera/gallery). `share_plus` hands a downloaded file to the OS's
  # native share/open sheet after fetching its bytes — simpler and more
  # reliable across Android versions than trying to open an arbitrary file
  # type directly ourselves.
  # Pinned to 10.3.10 specifically — 11.0.0 broke Android builds ("Updated
  # Android package to support AGP 9", which this project's toolchain
  # predates: "cannot find symbol FilePickerPlugin" in
  # GeneratedPluginRegistrant.java, a known/reported upstream issue as of
  # this writing, not something fixable from the app side). Uses
  # FilePicker.platform.pickFiles() — the .platform accessor was removed
  # in favor of a bare static call only in later versions.
  file_picker: 10.3.10
  # Pinned below latest (13.x) specifically — 13.x's win32 requirement
  # (^6.0.1) conflicts with file_picker's (^5.9.0); 12.0.2's win32 ^5.5.3
  # overlaps both. Still has the SharePlus.instance.share(ShareParams(...))
  # API this code uses (introduced in 11.0.0, unchanged through 12.x).
  share_plus: ^12.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
