openapi: 3.0.3
info:
  title: Autopilon Public API
  version: "1.0"
  description: |
    Machine-readable reference for the Autopilon Public API (/api/v1), status: beta.
    This spec covers exactly the endpoints implemented in server/publicApi/ — see
    PUBLIC_API.md for prose documentation, WEBHOOKS.md for webhook details, and
    API_SECURITY.md for the auth/tenancy/threat model.
  contact:
    url: https://github.com/beautybeespk-a11y/autopilon-mobile
servers:
  - url: https://<your-deployment>/api/v1
  - url: http://localhost:4000/api/v1

security:
  - ApiKeyAuth: []

tags:
  - name: Agents
  - name: Runs
  - name: Automations
  - name: Tasks
  - name: Projects
  - name: Files
  - name: Content
  - name: Integrations
  - name: Marketplace
  - name: Webhooks
  - name: Meta

paths:
  /:
    get:
      operationId: getApiInfo
      summary: API info (unauthenticated)
      tags: [Meta]
      security: []
      responses:
        "200":
          description: Basic info about this API version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: "Autopilon Public API" }
                  version: { type: string, example: "v1" }
                  status: { type: string, example: "beta" }
                  documentation: { type: string }

  /agents:
    get:
      operationId: listAgents
      summary: List agents
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of agents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }

  /agents/{id}:
    get:
      operationId: getAgent
      summary: Get an agent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }

  /agents/{id}/runs:
    get:
      operationId: listAgentRuns
      summary: List runs for an agent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/execute:
    post:
      operationId: executeAgent
      summary: Execute an agent (sync or async)
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                conversationId: { type: string, nullable: true }
                async: { type: boolean, default: false }
      responses:
        "200":
          description: Synchronous run result (async=false).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "202":
          description: Run queued (async=true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimitedOrQuota" }

  /agents/{id}/messages:
    post:
      operationId: messageAgent
      summary: Send a message to an agent (always synchronous)
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                conversationId: { type: string, nullable: true }
      responses:
        "200":
          description: The agent's reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId: { type: string }
                  response: { type: string }
                  usage: { $ref: "#/components/schemas/Usage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{id}:
    get:
      operationId: getRun
      summary: Get a run by id
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }

  /automations:
    get:
      operationId: listAutomations
      summary: List automations
      tags: [Automations]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of automations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Automation" }

  /automations/{id}:
    get:
      operationId: getAutomation
      summary: Get an automation
      tags: [Automations]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /automations/{id}/run:
    post:
      operationId: runAutomation
      summary: Trigger an automation run
      tags: [Automations]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The resulting automation run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /automations/{id}/runs:
    get:
      operationId: listAutomationRuns
      summary: List runs for an automation
      tags: [Automations]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of automation runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AutomationRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  /automations/runs/{runId}:
    get:
      operationId: getAutomationRun
      summary: Get an automation run by id
      tags: [Automations]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The automation run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of tasks.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: Create a task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high] }
                dueDate: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: The created task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidRequest" }

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTask
      summary: Update a task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [todo, in_progress, completed, archived] }
                priority: { type: string, enum: [low, medium, high] }
                dueDate: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveTask
      summary: Archive a task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The archived task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      summary: Mark a task complete
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The completed task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects:
    get:
      operationId: listProjects
      summary: List projects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated list of projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      summary: Create a project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string }
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/InvalidRequest" }

  /projects/{id}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Update a project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: archiveProject
      summary: Archive a project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The archived project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/items:
    get:
      operationId: listProjectItems
      summary: List items attached to a project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Project items.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addProjectItem
      summary: Attach an item to a project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemType, itemId]
              properties:
                itemType: { type: string }
                itemId: { type: string }
      responses:
        "200":
          description: The attached item record.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{id}/items/{itemType}/{itemId}:
    delete:
      operationId: removeProjectItem
      summary: Detach an item from a project
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: itemType
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removal confirmation.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /files:
    get:
      operationId: listFiles
      summary: List files
      tags: [Files]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: folderId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of files.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/File" }

  /files/{id}:
    get:
      operationId: getFile
      summary: Get file metadata
      tags: [Files]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteFile
      summary: Delete (trash) a file
      tags: [Files]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Deletion confirmation.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /files/upload:
    post:
      operationId: uploadFile
      summary: Upload a file
      tags: [Files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                folderId: { type: string }
                visibility: { type: string }
                tags: { type: string, description: "Comma-separated tag list" }
      responses:
        "201":
          description: The uploaded file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "413": { description: "File exceeds the 500 MB limit." }

  /files/{id}/content:
    get:
      operationId: downloadFileContent
      summary: Stream a file's raw bytes
      tags: [Files]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Raw file bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /files/{id}/download-url:
    post:
      operationId: createFileDownloadUrl
      summary: Mint a signed, time-limited download link
      tags: [Files]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInSeconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
      responses:
        "200":
          description: A signed download link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /content/{id}:
    get:
      operationId: getContentAsset
      summary: Get a generated content asset
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The content asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentAsset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /content/text:
    post:
      operationId: generateText
      summary: Generate text content
      tags: [Content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, brief]
              properties:
                contentType: { type: string }
                brief: { type: string }
                tone: { type: string }
                targetAudience: { type: string }
                keywords: { type: array, items: { type: string } }
                title: { type: string }
                agentId: { type: string }
      responses:
        "201":
          description: The generated content asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentAsset" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimitedOrQuota" }

  /content/image:
    post:
      operationId: generateImage
      summary: Generate image content
      tags: [Content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                negativePrompt: { type: string }
                size: { type: string }
                quality: { type: string }
                numImages: { type: integer, default: 1 }
                title: { type: string }
                agentId: { type: string }
      responses:
        "201":
          description: The generated content asset(s).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContentAsset" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimitedOrQuota" }

  /content/voice:
    post:
      operationId: generateVoice
      summary: Generate voice content
      tags: [Content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                voice: { type: string }
                speed: { type: number, default: 1.0 }
                title: { type: string }
                agentId: { type: string }
      responses:
        "201":
          description: The generated content asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentAsset" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/RateLimitedOrQuota" }

  /integrations:
    get:
      operationId: listIntegrations
      summary: List connected integrations
      tags: [Integrations]
      responses:
        "200":
          description: Connected integrations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }

  /marketplace/assets:
    get:
      operationId: browseMarketplaceAssets
      summary: Browse published marketplace assets
      tags: [Marketplace]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: assetType
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Marketplace assets (not cursor-paginated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  pagination:
                    type: object
                    properties:
                      limit: { type: integer }

  /marketplace/categories:
    get:
      operationId: listMarketplaceCategories
      summary: List marketplace categories
      tags: [Marketplace]
      responses:
        "200":
          description: Marketplace categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /webhooks/event-types:
    get:
      operationId: listWebhookEventTypes
      summary: List subscribable webhook event types
      tags: [Webhooks]
      responses:
        "200":
          description: Event types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string }

  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks
      tags: [Webhooks]
      responses:
        "200":
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
    post:
      operationId: createWebhook
      summary: Create a webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                description: { type: string }
                events:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: The created webhook (includes the signing secret once).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Webhook"
                  - type: object
                    properties:
                      secret: { type: string }
        "400": { $ref: "#/components/responses/InvalidRequest" }

  /webhooks/{id}:
    get:
      operationId: getWebhook
      summary: Get a webhook
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWebhook
      summary: Update a webhook
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                description: { type: string }
                events: { type: array, items: { type: string } }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: The updated webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/{id}/secret:
    get:
      operationId: getWebhookSecret
      summary: Reveal a webhook's signing secret
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The signing secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  masked: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/{id}/test:
    post:
      operationId: sendTestWebhookEvent
      summary: Send a synchronous test event
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The real delivery result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  eventType: { type: string, example: "test.ping" }
                  payload: { type: object, additionalProperties: true }
                  httpStatus: { type: integer, nullable: true }
                  responseTimeMs: { type: integer }
                  error: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List a webhook's delivery history
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Delivery history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "ap_live_<key>"
      description: |
        Bearer API key issued from an organization's Developer Console.
        Never a session cookie. See API_SECURITY.md.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's pagination.nextCursor.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: Missing/malformed/invalid/revoked/expired API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InsufficientScope:
      description: The API key lacks the scope this route requires.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FeatureDisabled:
      description: This resource area (or the whole API) is currently flagged off for this org.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource in this organization.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: Missing/malformed request body or query parameter.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimitedOrQuota:
      description: Per-key rate limit exceeded, or the organization's usage/spend quota is exhausted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "RESOURCE_NOT_FOUND" }
            message: { type: string }
            request_id: { type: string, nullable: true }

    PaginatedResponse:
      type: object
      properties:
        pagination:
          type: object
          properties:
            nextCursor: { type: string, nullable: true }
            hasMore: { type: boolean }
            limit: { type: integer }

    Usage:
      type: object
      properties:
        promptTokens: { type: integer }
        completionTokens: { type: integer }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        personality: { type: string, nullable: true }
        status: { type: string }
        category: { type: string, nullable: true }
        scope: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Run:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        conversationId: { type: string, nullable: true }
        jobId: { type: string, nullable: true }
        mode: { type: string, enum: [sync, async] }
        status: { type: string, enum: [queued, running, completed, failed] }
        response: { type: string, nullable: true }
        usage: { $ref: "#/components/schemas/Usage" }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    Automation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        triggerType: { type: string }
        status: { type: string }
        agentId: { type: string, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AutomationRun:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        automationId: { type: string }
        status: { type: string }
        variables: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [todo, in_progress, completed, archived] }
        priority: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        assignedToUserId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    File:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        mimeType: { type: string, nullable: true }
        extension: { type: string, nullable: true }
        sizeBytes: { type: integer }
        folderId: { type: string, nullable: true }
        visibility: { type: string }
        status: { type: string }
        processingStatus: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContentAsset:
      type: object
      properties:
        id: { type: string }
        contentType: { type: string }
        title: { type: string, nullable: true }
        textContent: { type: string, nullable: true }
        fileId: { type: string, nullable: true }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        description: { type: string, nullable: true }
        events: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        eventType: { type: string }
        eventId: { type: string }
        httpStatus: { type: integer, nullable: true }
        responseTimeMs: { type: integer, nullable: true }
        attempts: { type: integer }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        status: { type: string }
        createdAt: { type: string, format: date-time }
